apiVersion: apps/v1
kind: Deployment
metadata: {name: nats, namespace: incidentlab}
spec:
  replicas: 1
  selector: {matchLabels: {app: nats}}
  template:
    metadata: {labels: {app: nats}}
    spec:
      containers: [{name: nats, image: "nats:2.10.22-alpine", args: [-js, -sd, /data], ports: [{containerPort: 4222}], volumeMounts: [{name: data, mountPath: /data}]}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: nats, namespace: incidentlab}
spec: {selector: {app: nats}, ports: [{port: 4222, targetPort: 4222}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector, namespace: incidentlab}
spec:
  replicas: 1
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      containers: [{name: collector, image: "otel/opentelemetry-collector-contrib:0.109.0", args: [--config=/etc/otel/config.yaml], ports: [{containerPort: 4317}], volumeMounts: [{name: config, mountPath: /etc/otel}]}]
      volumes: [{name: config, configMap: {name: otel-config}}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: otel-config, namespace: incidentlab}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {}
    processors: {batch: {}}
    exporters: {debug: {verbosity: basic}}
    service:
      pipelines:
        traces: {receivers: [otlp], processors: [batch], exporters: [debug]}
