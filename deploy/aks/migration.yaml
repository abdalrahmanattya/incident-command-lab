apiVersion: batch/v1
kind: Job
metadata: {name: schema-migration, namespace: incidentlab}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: postgres:16-alpine
          command: [sh, -c]
          args: ["psql \"$DATABASE_URL\" -f /schema/init.sql"]
          env: [{name: DATABASE_URL, valueFrom: {secretKeyRef: {name: database, key: url}}}]
          volumeMounts: [{name: schema, mountPath: /schema}]
      volumes: [{name: schema, configMap: {name: database-schema}}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: database-schema, namespace: incidentlab}
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS processed_events (event_id uuid PRIMARY KEY, consumer text NOT NULL, processed_at timestamptz NOT NULL DEFAULT now());
