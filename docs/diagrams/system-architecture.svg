<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Incident Command Lab system architecture</title><desc id="desc">Numbered reservation flow through operator console, Go gateway, reservation and outbox, JetStream workers, payment and notification simulators, compensation and dead letter queue, and telemetry.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10243a"/></linearGradient><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L11 5 0 10z" fill="#75e0d2"/></marker><marker id="amber" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L11 5 0 10z" fill="#f8bf67"/></marker><style>text{font-family:Arial,sans-serif;fill:#e5f0fb}.title{font-size:30px;font-weight:700}.sub{font-size:14px;fill:#9eb5ca}.label{font-size:15px;font-weight:700}.tiny{font-size:12px;fill:#a9bfd3}.card{fill:#17314d;stroke:#315170;stroke-width:2}.boundary{fill:#0b1b2c;fill-opacity:.72;stroke:#42627e;stroke-width:2;stroke-dasharray:9 7}.flow{fill:none;stroke:#75e0d2;stroke-width:3;marker-end:url(#arrow)}.comp{fill:none;stroke:#f8bf67;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#amber)}.num{fill:#75e0d2}.numt{font-size:14px;fill:#07111f;font-weight:700}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/><text class="title" x="55" y="60">Incident Command Lab · operator and event system</text><text class="sub" x="55" y="87">Credential-free local path; PostgreSQL, JetStream, simulators, compensation, DLQ and OTel are explicit boundaries.</text>
<rect class="boundary" x="35" y="120" width="1090" height="680" rx="18"/><text class="label" x="60" y="153">APPLICATION + DURABILITY BOUNDARY</text><rect class="boundary" x="1150" y="120" width="410" height="680" rx="18"/><text class="label" x="1175" y="153">OPERATOR + TELEMETRY</text>
<rect class="card" x="65" y="205" width="185" height="85" rx="12"/><text class="label" x="92" y="242">Customer</text><text class="tiny" x="92" y="263">reservation API</text><rect class="card" x="285" y="205" width="190" height="85" rx="12"/><text class="label" x="310" y="242">Go gateway</text><text class="tiny" x="310" y="263">HTTP + traceparent</text><rect class="card" x="510" y="185" width="225" height="125" rx="12"/><text class="label" x="535" y="220">Reservation service</text><text class="tiny" x="535" y="244">idempotency + stock</text><text class="tiny" x="535" y="264">saga coordinator</text><text class="tiny" x="535" y="284">reversible faults</text><rect class="card" x="790" y="205" width="230" height="85" rx="12"/><text class="label" x="815" y="242">Transactional outbox</text><text class="tiny" x="815" y="263">pending → published</text>
<rect class="card" x="790" y="365" width="230" height="85" rx="12"/><text class="label" x="815" y="402">NATS JetStream</text><text class="tiny" x="815" y="423">durable subjects + ack</text><rect class="card" x="510" y="365" width="225" height="85" rx="12"/><text class="label" x="535" y="402">PostgreSQL</text><text class="tiny" x="535" y="423">reservations + outcomes</text><rect class="card" x="790" y="520" width="230" height="85" rx="12"/><text class="label" x="815" y="557">Payment simulator</text><text class="tiny" x="815" y="578">capture / fail outcome</text><rect class="card" x="510" y="520" width="225" height="85" rx="12"/><text class="label" x="535" y="557">Notification simulator</text><text class="tiny" x="535" y="578">delivery outcome</text><rect class="card" x="790" y="675" width="230" height="85" rx="12"/><text class="label" x="815" y="712">Compensation + DLQ</text><text class="tiny" x="815" y="733">release stock / max delivery</text>
<rect class="card" x="1180" y="205" width="350" height="85" rx="12"/><text class="label" x="1210" y="242">React operator console</text><text class="tiny" x="1210" y="263">health · queue · incidents · controls</text><rect class="card" x="1180" y="365" width="350" height="85" rx="12"/><text class="label" x="1210" y="402">Incident evidence + analyst</text><text class="tiny" x="1210" y="423">timeline · signals · runbooks · advisory</text><rect class="card" x="1180" y="525" width="165" height="85" rx="12"/><text class="label" x="1205" y="562">OTel</text><text class="tiny" x="1205" y="583">traces + metrics</text><rect class="card" x="1365" y="525" width="165" height="85" rx="12"/><text class="label" x="1390" y="562">Logs</text><text class="tiny" x="1390" y="583">correlated JSON</text>
