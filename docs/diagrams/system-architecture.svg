<rect x="55" y="835" width="20" height="3" fill="#75e0d2"/><text class="tiny" x="85" y="840">request / event flow</text><rect x="250" y="835" width="20" height="3" fill="#f8bf67"/><text class="tiny" x="280" y="840">compensation / recovery</text><text class="tiny" x="520" y="840">Key benefits: deterministic replay · idempotency · bounded faults · evidence-first recovery</text>
</svg>
